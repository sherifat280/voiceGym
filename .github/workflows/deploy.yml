name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Grant GITHUB_TOKEN permissions required to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect package manager / lockfile
        id: detect_pm
        run: |
          # Detect common lockfiles and set output 'pm' to 'npm'|'yarn'|'pnpm'|'none'
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "pm=npm" >> $GITHUB_OUTPUT
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> $GITHUB_OUTPUT
          elif [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> $GITHUB_OUTPUT
          else
            echo "pm=none" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js (with cache when lockfile found)
        if: steps.detect_pm.outputs.pm != 'none'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.detect_pm.outputs.pm }}

      - name: Setup Node.js (no cache when no lockfile)
        if: steps.detect_pm.outputs.pm == 'none'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build application (static prerender)
        run: npm run build
        env:
          GITHUB_PAGES: '1'
          VITE_BASE_PATH: /${{ github.event.repository.name }}/


      - name: Determine deployment directory
        run: |
          if [ -d ".output/public" ]; then
            echo "DEPLOY_DIR=.output/public" >> $GITHUB_ENV
          elif [ -d "dist/client" ]; then
            echo "DEPLOY_DIR=dist/client" >> $GITHUB_ENV
          elif [ -d "dist" ]; then
            echo "DEPLOY_DIR=dist" >> $GITHUB_ENV
          else
            echo "DEPLOY_DIR=." >> $GITHUB_ENV
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DEPLOY_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
